name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the list of lectures and phrases from assets/
        run: python tools/build_index.py

      - name: Save the list in the repository
        run: |
          if [ -n "$(git status --porcelain data/lectures.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/lectures.json
            git commit -m "Update the list of phrases"
            git pull --rebase
            git push
          else
            echo "The list of phrases is up to date."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the analysis tests
        run: node tests/run-tests.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
