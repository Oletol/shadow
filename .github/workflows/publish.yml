name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the list of lectures and phrases from assets/
        run: python tools/build_index.py

      # The list is built here for the published site only. It is not saved back to
      # the repository: a commit made by this job after every push made the next
      # push from the author's computer fail.
      - name: Build the SCORM packages for Moodle (downloads/scorm/)
        run: python tools/build_scorm.py
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the analysis tests
        run: node tests/run-tests.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
